services:
  controller:
    build: .
    command: clusterwatch-controller
    environment:
      CW_DATABASE_PATH: /app/data/clusterwatch.db
      CW_OFFLINE_TIMEOUT_SECONDS: ${CW_OFFLINE_TIMEOUT_SECONDS:-15}
      CW_CPU_WARNING_PERCENT: ${CW_CPU_WARNING_PERCENT:-85}
      CW_MEMORY_WARNING_PERCENT: ${CW_MEMORY_WARNING_PERCENT:-85}
      CW_DISK_WARNING_PERCENT: ${CW_DISK_WARNING_PERCENT:-90}
      CW_TEMPERATURE_WARNING_C: ${CW_TEMPERATURE_WARNING_C:-80}
      CW_API_KEY: ${CW_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - clusterwatch-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  agent:
    build: .
    command: clusterwatch-agent
    environment:
      CW_CONTROLLER_URL: http://controller:8000
      CW_SAMPLE_INTERVAL_SECONDS: ${CW_SAMPLE_INTERVAL_SECONDS:-5}
      CW_NODE_LABELS: role=simulated,runtime=docker
      CW_ENABLE_JETSON_TELEMETRY: "false"
      CW_API_KEY: ${CW_API_KEY:-}
    depends_on:
      controller:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clusterwatch-data:
