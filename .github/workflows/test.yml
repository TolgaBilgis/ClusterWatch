name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,deploy]"
      - run: pytest --cov=clusterwatch --cov-report=term-missing
      - run: cd deploy/ansible && ansible-playbook -i inventory.example.yml site.yml --syntax-check
