[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterwatch"
version = "0.1.0"
description = "Lightweight distributed Linux cluster monitoring for physical and simulated nodes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "psutil>=5.9,<8.0",
  "pydantic>=2.7,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
]
deploy = [
  "ansible-core>=2.16,<3.0",
]

[project.scripts]
clusterwatch-controller = "clusterwatch.controller.app:run"
clusterwatch-agent = "clusterwatch.agent.main:run"

[tool.setuptools.packages.find]
include = ["clusterwatch*"]

[tool.setuptools.package-data]
"clusterwatch.dashboard" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
