<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">ClusterWatch architecture</title><desc id="desc">A Jetson physical agent and scalable Docker agents send metrics and heartbeats to a FastAPI controller backed by SQLite, which serves a dashboard and REST API.</desc>
  <defs><style>.bg{fill:#090c0f}.box{fill:#11161b;stroke:#39434d;stroke-width:2}.hi{fill:#3ee896}.txt{fill:#edf2f4;font:600 18px sans-serif}.small{fill:#84919c;font:14px sans-serif}.mono{fill:#3ee896;font:700 12px monospace;letter-spacing:1px}.line{stroke:#3ee896;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" class="hi"/></marker></defs>
  <rect width="1100" height="520" rx="18" class="bg"/><text x="55" y="55" class="mono">CLUSTERWATCH · DATA FLOW</text>
  <rect x="55" y="95" width="250" height="145" rx="8" class="box"/><circle cx="85" cy="128" r="6" class="hi"/><text x="104" y="135" class="txt">Jetson physical node</text><text x="80" y="175" class="small">Native Linux agent</text><text x="80" y="202" class="small">psutil + sysfs + tegrastats</text>
  <rect x="55" y="280" width="250" height="155" rx="8" class="box"/><text x="80" y="320" class="txt">Docker agents × N</text><text x="80" y="355" class="small">Independent hostnames</text><text x="80" y="382" class="small">Shared Jetson kernel</text><text x="80" y="409" class="small">Compose --scale agent=5</text>
  <path d="M305 166H440" class="line"/><path d="M305 357H382Q410 357 410 329V270Q410 242 440 242" class="line dash"/><text x="326" y="145" class="small">HTTPS / REST</text><text x="326" y="342" class="small">metrics + heartbeat</text>
  <rect x="440" y="125" width="275" height="230" rx="8" class="box"/><text x="470" y="168" class="mono">CONTROL PLANE</text><text x="470" y="207" class="txt">FastAPI controller</text><text x="470" y="242" class="small">Registration + ingestion</text><text x="470" y="271" class="small">Health evaluation</text><text x="470" y="300" class="small">Historical query API</text><rect x="470" y="320" width="215" height="2" class="hi"/>
  <path d="M578 355V430" class="line"/><rect x="463" y="430" width="230" height="58" rx="8" class="box"/><text x="515" y="466" class="txt">SQLite history</text>
  <path d="M715 240H805" class="line"/><rect x="805" y="151" width="240" height="178" rx="8" class="box"/><text x="835" y="192" class="mono">PRESENTATION</text><text x="835" y="230" class="txt">Web dashboard</text><text x="835" y="265" class="small">Cluster overview</text><text x="835" y="293" class="small">Node history + status</text>
</svg>

